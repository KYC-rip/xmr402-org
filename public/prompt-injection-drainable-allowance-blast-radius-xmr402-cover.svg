<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff5555" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5555" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff6600" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#orange)"/>

  <!-- blast radius rings on the right -->
  <g transform="translate(1010,300)">
    <circle cx="0" cy="0" r="220" fill="url(#blast)"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#ff6600" stroke-width="1.5" opacity="0.45" stroke-dasharray="6 8"/>
    <circle cx="0" cy="0" r="165" fill="none" stroke="#ff5555" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 10"/>
    <!-- wallet glyph at epicenter -->
    <rect x="-44" y="-30" width="88" height="60" rx="10" fill="#1c1c28" stroke="#ff8a33" stroke-width="2"/>
    <rect x="-44" y="-12" width="88" height="14" fill="#ff6600" opacity="0.85"/>
    <circle cx="26" cy="6" r="6" fill="#0a0a0f" stroke="#ff8a33" stroke-width="2"/>
    <text x="0" y="-44" fill="#ff5555" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">DRAIN</text>
  </g>

  <!-- tag -->
  <rect x="80" y="70" width="330" height="34" rx="17" fill="none" stroke="#ff6600" stroke-width="1.5" opacity="0.7"/>
  <text x="100" y="93" fill="#ff8a33" font-size="16" letter-spacing="3" font-weight="600">PROMPT INJECTION &#215; AGENT WALLETS</text>

  <!-- title -->
  <text x="80" y="190" fill="#ffffff" font-size="60" font-weight="800">The Drainable</text>
  <text x="80" y="258" fill="#ffffff" font-size="60" font-weight="800">Allowance</text>
  <text x="80" y="312" fill="#9a9aa8" font-size="25" font-weight="400">Why standing spend caps are honeypots —</text>
  <text x="80" y="344" fill="#9a9aa8" font-size="25" font-weight="400">and XMR402 shrinks the blast radius</text>

  <!-- contrast line -->
  <g font-family="'Courier New',monospace">
    <text x="80" y="430" fill="#6f6f80" font-size="26">standing cap</text>
    <text x="320" y="430" fill="#ff5555" font-size="26" font-weight="700">drain all hour</text>
    <text x="600" y="430" fill="#6f6f80" font-size="26">vs per-request</text>
    <text x="860" y="430" fill="#ff8a33" font-size="26" font-weight="700" filter="url(#glow)">1 payment</text>
  </g>

  <!-- feature chips -->
  <g font-size="18" font-weight="600">
    <rect x="80" y="478" width="200" height="46" rx="23" fill="#1c1c28" stroke="#ff6600" stroke-width="1" opacity="0.95"/>
    <text x="105" y="507" fill="#ff8a33">no standing key</text>
    <rect x="296" y="478" width="180" height="46" rx="23" fill="#1c1c28" stroke="#ff6600" stroke-width="1" opacity="0.95"/>
    <text x="321" y="507" fill="#ff8a33">200ms 0-conf</text>
    <rect x="492" y="478" width="210" height="46" rx="23" fill="#1c1c28" stroke="#ff6600" stroke-width="1" opacity="0.95"/>
    <text x="517" y="507" fill="#ff8a33">stateless per 402</text>
  </g>

  <!-- monero glyph small -->
  <g transform="translate(150,575)">
    <text x="0" y="0" fill="url(#orange)" font-size="40" font-weight="800" text-anchor="middle" font-family="Georgia,serif">&#8338;</text>
  </g>

  <!-- footer -->
  <text x="190" y="587" fill="#ff6600" font-size="22" font-weight="700">xmr402.org</text>
  <text x="1120" y="600" fill="#6f6f80" font-size="18" text-anchor="end">@xbtoshi</text>
</svg>
