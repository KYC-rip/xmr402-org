<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff6600" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#orange)"/>

  <!-- tag -->
  <rect x="80" y="68" width="300" height="34" rx="17" fill="none" stroke="#ff6600" stroke-width="1.5" opacity="0.7"/>
  <text x="100" y="91" fill="#ff8a33" font-size="16" letter-spacing="3" font-weight="600">AGENTIC TRAVEL &amp; PRIVACY</text>

  <!-- title -->
  <text x="80" y="185" fill="#ffffff" font-size="60" font-weight="800">The Itinerary</text>
  <text x="80" y="255" fill="#ffffff" font-size="60" font-weight="800">on the Ledger</text>
  <text x="80" y="312" fill="#9a9aa8" font-size="25" font-weight="400">Your AI travel agent's trail maps every place you sleep</text>

  <!-- route map: dotted travel path with pins -->
  <g>
    <line x1="120" y1="470" x2="300" y2="420" stroke="#ff6600" stroke-width="2" stroke-dasharray="6 7" opacity="0.8"/>
    <line x1="300" y1="420" x2="500" y2="500" stroke="#ff6600" stroke-width="2" stroke-dasharray="6 7" opacity="0.8"/>
    <line x1="500" y1="500" x2="690" y2="430" stroke="#ff6600" stroke-width="2" stroke-dasharray="6 7" opacity="0.8"/>
    <!-- pins -->
    <g fill="#ff6600" filter="url(#glow)">
      <path d="M120 470c-13 0-23-10-23-23 0-17 23-39 23-39s23 22 23 39c0 13-10 23-23 23z" transform="translate(0,-30) scale(0.55)" transform-origin="120 470"/>
    </g>
    <g fill="url(#orange)">
      <circle cx="120" cy="470" r="9"/><circle cx="300" cy="420" r="9"/>
      <circle cx="500" cy="500" r="9"/><circle cx="690" cy="430" r="9"/>
    </g>
    <g fill="#0a0a0f"><circle cx="120" cy="470" r="4"/><circle cx="300" cy="420" r="4"/><circle cx="500" cy="500" r="4"/><circle cx="690" cy="430" r="4"/></g>
    <text x="105" y="510" fill="#6f6f80" font-size="15" font-family="'Courier New',monospace">night 1</text>
    <text x="285" y="404" fill="#6f6f80" font-size="15" font-family="'Courier New',monospace">night 4</text>
    <text x="485" y="535" fill="#6f6f80" font-size="15" font-family="'Courier New',monospace">night 7</text>
    <text x="673" y="414" fill="#6f6f80" font-size="15" font-family="'Courier New',monospace">night 9</text>
  </g>

  <!-- exposed vs private chips -->
  <g font-family="'Courier New',monospace">
    <rect x="790" y="395" width="330" height="54" rx="8" fill="none" stroke="#ff5555" stroke-width="1.5" opacity="0.8"/>
    <text x="810" y="420" fill="#ff5555" font-size="16">USDC on Base</text>
    <text x="810" y="440" fill="#9a9aa8" font-size="14">itinerary is public &amp; permanent</text>

    <rect x="790" y="465" width="330" height="54" rx="8" fill="none" stroke="#ff8a33" stroke-width="1.5"/>
    <text x="810" y="490" fill="#ff8a33" font-size="16" filter="url(#glow)">XMR402</text>
    <text x="810" y="510" fill="#9a9aa8" font-size="14">same booking, no trail</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="565" x2="1120" y2="565" stroke="#ff6600" stroke-width="1" opacity="0.2"/>
  <text x="80" y="595" fill="#ff8a33" font-size="20" font-weight="700">XMR402</text>
  <text x="170" y="595" fill="#6f6f80" font-size="18">the privacy layer for the agentic economy</text>
  <text x="1120" y="595" fill="#6f6f80" font-size="16" text-anchor="end">xmr402.org</text>
</svg>
