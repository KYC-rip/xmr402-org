<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Approval Friction Wall vs XMR402 Stateless">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#11111a"/>
    </linearGradient>
    <linearGradient id="orangeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a26" stroke-width="1"/>
    </pattern>
    <pattern id="brickPattern" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#1a0a02"/>
      <path d="M 0 20 L 80 20 M 40 0 L 40 20 M 0 40 L 0 20 M 80 40 L 80 20 M 20 20 L 20 40 M 60 20 L 60 40" fill="none" stroke="#ff6600" stroke-width="1.5" stroke-opacity="0.55"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Top corner mark -->
  <g transform="translate(48, 44)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="0" width="14" height="14" fill="#ff6600"/>
    <text x="24" y="12" fill="#e6e6f0" font-size="14" letter-spacing="2">XMR402.ORG</text>
    <text x="24" y="30" fill="#7a7a90" font-size="11" letter-spacing="2">/ DISPATCH · 2026-05-28</text>
  </g>

  <!-- Top right small stat -->
  <g transform="translate(1152, 60)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text fill="#7a7a90" font-size="11" letter-spacing="2">SOURCE · ARTEMIS</text>
  </g>

  <!-- Title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="48" y="142" fill="#ffffff" font-size="44" font-weight="700">The Approval Friction Wall</text>
    <text x="48" y="184" fill="#9a9ab0" font-size="22" font-weight="400">Why x402 volume collapsed 77% — and why XMR402 doesn't have the wall to climb.</text>
  </g>

  <!-- LEFT: Brick wall with "APPROVAL FRICTION" -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="500" height="320" fill="url(#brickPattern)" stroke="#ff6600" stroke-opacity="0.8" stroke-width="2" rx="6"/>
    <!-- Wallet pop-up icons stuck on wall -->
    <g transform="translate(40, 40)">
      <rect width="120" height="78" rx="8" fill="#11111a" stroke="#ff6600" stroke-width="1.5"/>
      <text x="12" y="22" fill="#ff6600" font-family="ui-monospace, Menlo, monospace" font-size="10">METAMASK</text>
      <text x="12" y="42" fill="#e6e6f0" font-family="ui-sans-serif, system-ui" font-size="11">Approve $0.001?</text>
      <rect x="12" y="52" width="42" height="18" rx="3" fill="#ff6600"/>
      <text x="20" y="65" fill="#0a0a0f" font-family="ui-sans-serif, system-ui" font-size="10" font-weight="700">APPROVE</text>
      <rect x="62" y="52" width="42" height="18" rx="3" fill="none" stroke="#7a7a90"/>
      <text x="74" y="65" fill="#7a7a90" font-family="ui-sans-serif, system-ui" font-size="10">DENY</text>
    </g>
    <g transform="translate(190, 70)">
      <rect width="120" height="78" rx="8" fill="#11111a" stroke="#ff6600" stroke-width="1.5"/>
      <text x="12" y="22" fill="#ff6600" font-family="ui-monospace, Menlo, monospace" font-size="10">TRUST WALLET</text>
      <text x="12" y="42" fill="#e6e6f0" font-family="ui-sans-serif, system-ui" font-size="11">Sign tx ($0.002)?</text>
      <rect x="12" y="52" width="42" height="18" rx="3" fill="#ff6600"/>
      <text x="24" y="65" fill="#0a0a0f" font-family="ui-sans-serif, system-ui" font-size="10" font-weight="700">SIGN</text>
      <rect x="62" y="52" width="42" height="18" rx="3" fill="none" stroke="#7a7a90"/>
      <text x="74" y="65" fill="#7a7a90" font-family="ui-sans-serif, system-ui" font-size="10">SKIP</text>
    </g>
    <g transform="translate(340, 40)">
      <rect width="120" height="78" rx="8" fill="#11111a" stroke="#ff6600" stroke-width="1.5"/>
      <text x="12" y="22" fill="#ff6600" font-family="ui-monospace, Menlo, monospace" font-size="10">FIREBLOCKS</text>
      <text x="12" y="42" fill="#e6e6f0" font-family="ui-sans-serif, system-ui" font-size="11">Mandate exceeded</text>
      <rect x="12" y="52" width="60" height="18" rx="3" fill="#ff6600"/>
      <text x="20" y="65" fill="#0a0a0f" font-family="ui-sans-serif, system-ui" font-size="10" font-weight="700">RE-AUTH</text>
    </g>
    <!-- Stat block on wall -->
    <g transform="translate(60, 180)">
      <text fill="#ff8a3d" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3">VOLUME · NOV 25 → MAY 26</text>
      <text x="0" y="60" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-size="74" font-weight="800">−77%</text>
      <text x="0" y="92" fill="#9a9ab0" font-family="ui-monospace, Menlo, monospace" font-size="13">$5.15M → $1.19M (Artemis)</text>
      <text x="0" y="118" fill="#9a9ab0" font-family="ui-monospace, Menlo, monospace" font-size="13">4,000–12,000 hrs/mo human approval</text>
    </g>
  </g>

  <!-- Wall label -->
  <g transform="translate(60, 220)" font-family="ui-monospace, Menlo, monospace">
    <text fill="#ff6600" font-size="13" letter-spacing="4">x402 + USDC · STATEFUL</text>
  </g>

  <!-- Center divider arrow -->
  <g transform="translate(600, 400)" filter="url(#softGlow)">
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#ff6600" stroke-width="3"/>
    <polygon points="20,-10 40,0 20,10" fill="#ff6600"/>
  </g>

  <!-- RIGHT: Stateless XMR402 flow -->
  <g transform="translate(660, 240)">
    <rect x="0" y="0" width="480" height="320" rx="6" fill="#0d0d18" stroke="#ff6600" stroke-width="2"/>
    <g transform="translate(20, 28)" font-family="ui-monospace, Menlo, monospace">
      <text fill="#ff6600" font-size="13" letter-spacing="4">XMR402 · STATELESS</text>
    </g>

    <!-- Flow nodes -->
    <g transform="translate(20, 64)" font-family="ui-sans-serif, system-ui">
      <!-- Agent node -->
      <rect x="0" y="0" width="120" height="56" rx="6" fill="#11111a" stroke="#ff6600" stroke-width="1.5"/>
      <text x="60" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">AGENT</text>
      <text x="60" y="42" text-anchor="middle" fill="#9a9ab0" font-size="10">autonomous</text>

      <!-- Arrow -->
      <line x1="120" y1="28" x2="160" y2="28" stroke="#ff6600" stroke-width="1.5"/>
      <polygon points="160,24 168,28 160,32" fill="#ff6600"/>

      <!-- Gateway node -->
      <rect x="168" y="0" width="130" height="56" rx="6" fill="#11111a" stroke="#ff6600" stroke-width="1.5"/>
      <text x="233" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">RIPLEY GATEWAY</text>
      <text x="233" y="42" text-anchor="middle" fill="#9a9ab0" font-size="10">holds wallet · signs locally</text>

      <!-- Arrow -->
      <line x1="298" y1="28" x2="338" y2="28" stroke="#ff6600" stroke-width="1.5"/>
      <polygon points="338,24 346,28 338,32" fill="#ff6600"/>

      <!-- Guard node -->
      <rect x="346" y="0" width="94" height="56" rx="6" fill="#11111a" stroke="#ff6600" stroke-width="1.5"/>
      <text x="393" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">GUARD</text>
      <text x="393" y="42" text-anchor="middle" fill="#9a9ab0" font-size="10">verifies TX Proof</text>
    </g>

    <!-- TX Proof badge -->
    <g transform="translate(20, 152)">
      <rect width="440" height="68" rx="6" fill="#1a0a02" stroke="#ff6600" stroke-opacity="0.5"/>
      <text x="20" y="28" fill="#ff8a3d" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">MONERO TX PROOF · STATELESS VERIFY</text>
      <text x="20" y="52" fill="#e6e6f0" font-family="ui-monospace, Menlo, monospace" font-size="13">~200ms · 0-conf · RingCT · no human</text>
    </g>

    <!-- Big stat -->
    <g transform="translate(20, 244)">
      <text fill="#ff8a3d" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3">HUMAN APPROVALS PER PAYMENT</text>
      <text x="0" y="60" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-size="74" font-weight="800">0</text>
    </g>

    <!-- side label -->
    <g transform="translate(200, 290)" font-family="ui-monospace, Menlo, monospace">
      <text fill="#9a9ab0" font-size="12">protocol fees:</text>
      <text x="0" y="18" fill="#ff6600" font-size="20" font-weight="700">0%</text>
      <text x="120" y="0" fill="#9a9ab0" font-size="12">attention tax:</text>
      <text x="120" y="18" fill="#ff6600" font-size="20" font-weight="700">none</text>
    </g>
  </g>

  <!-- Bottom strip: HTTP 402 trace -->
  <g transform="translate(48, 590)" font-family="ui-monospace, Menlo, monospace" font-size="12">
    <text fill="#7a7a90">HTTP/1.1 402 PAYMENT REQUIRED</text>
    <text x="320" fill="#7a7a90">X-Payment-Network: monero</text>
    <text x="630" fill="#7a7a90">X-Verification: tx-proof</text>
    <text x="920" fill="#ff6600">200 OK</text>
  </g>

  <!-- Decorative circles -->
  <g opacity="0.35">
    <circle cx="1140" cy="180" r="60" fill="none" stroke="#ff6600" stroke-width="1"/>
    <circle cx="1140" cy="180" r="40" fill="none" stroke="#ff6600" stroke-width="1"/>
    <circle cx="1140" cy="180" r="20" fill="#ff6600"/>
  </g>
</svg>
