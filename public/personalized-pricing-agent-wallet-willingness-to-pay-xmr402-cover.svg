<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="60%" stop-color="#0d0b12"/>
      <stop offset="100%" stop-color="#140c06"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff6600" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="300" r="330" fill="url(#glow)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#fade)"/>
  <text x="72" y="86" fill="#ff6600" font-size="19" font-weight="700" letter-spacing="5">XMR402.ORG</text>
  <text x="72" y="112" fill="#5c5c6b" font-size="15" letter-spacing="2.5">MONERO-NATIVE X402 &#183; SEPTEMBER 7, 2026</text>

  <!-- title -->
  <text x="72" y="196" fill="#f5f5f7" font-size="53" font-weight="700">The Willingness-to-Pay</text>
  <text x="72" y="256" fill="#f5f5f7" font-size="53" font-weight="700">Oracle</text>
  <rect x="72" y="284" width="132" height="4" fill="#ff6600"/>
  <text x="72" y="336" fill="#a7a7b4" font-size="25">Public agent wallets price you before you ask.</text>
  <text x="72" y="372" fill="#a7a7b4" font-size="25">XMR402 quotes blind.</text>

  <!-- transparent-rail dossier panel -->
  <rect x="72" y="416" width="470" height="150" rx="12" fill="#12121a" stroke="#2a2a38" stroke-width="1.5"/>
  <text x="96" y="448" fill="#6b6b7d" font-size="13" letter-spacing="2.2">TRANSPARENT RAIL &#183; READABLE BY ANYONE</text>
  <g font-size="15" fill="#d8d8e0">
    <circle cx="102" cy="475" r="3" fill="#ff6600"/><text x="116" y="480">balance &#183; spend rate &#183; idle slack</text>
    <circle cx="102" cy="505" r="3" fill="#ff6600"/><text x="116" y="510">counterparty graph &#183; realized prices</text>
    <circle cx="102" cy="535" r="3" fill="#ff6600"/><text x="116" y="540">retry &#183; comparison-shopping behavior</text>
  </g>

  <!-- xmr402 panel -->
  <rect x="578" y="416" width="470" height="150" rx="12" fill="#1a1008" stroke="#ff6600" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="602" y="448" fill="#ff8c33" font-size="13" letter-spacing="2.2">XMR402 &#183; WHAT THE MERCHANT LEARNS</text>
  <text x="602" y="486" fill="#f5f5f7" font-size="21" font-weight="700">&#8220;This request was paid for.&#8221;</text>
  <text x="602" y="520" fill="#9a9aa8" font-size="15">Monero TX Proof &#183; ~200ms &#183; 0-conf</text>
  <text x="602" y="546" fill="#9a9aa8" font-size="15">Fresh subaddress per request &#183; stateless</text>

  <!-- ledger / eye motif -->
  <g transform="translate(880,190)" opacity="0.92">
    <circle cx="90" cy="70" r="86" fill="none" stroke="#ff6600" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle cx="90" cy="70" r="60" fill="none" stroke="#ff6600" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="90" cy="70" r="17" fill="#ff6600" fill-opacity="0.85"/>
    <path d="M4 70 Q90 -6 176 70 Q90 146 4 70 Z" fill="none" stroke="#ff6600" stroke-width="2.5" stroke-opacity="0.85"/>
    <text x="90" y="186" text-anchor="middle" fill="#6b6b7d" font-size="14" letter-spacing="3">402</text>
  </g>

  <!-- footer -->
  <text x="72" y="600" fill="#4d4d5c" font-size="14" letter-spacing="1.5">FTC PERSONALIZED PRICING POLICY &#183; AUG 19, 2026</text>
  <text x="1128" y="600" text-anchor="end" fill="#4d4d5c" font-size="14" letter-spacing="1.5">@XBTOSHI</text>
</svg>
