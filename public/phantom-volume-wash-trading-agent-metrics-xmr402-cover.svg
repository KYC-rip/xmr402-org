<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Mirage Metric — Wash Trading in Agentic Payments — XMR402">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="55%" stop-color="#0d0d16"/>
      <stop offset="100%" stop-color="#100b08"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ffa14d"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b7280" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="realbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff6600" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6b7280" stroke-opacity="0.35" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff6600"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="960" cy="150" rx="380" ry="280" fill="url(#glow)"/>

  <!-- top rule -->
  <rect x="72" y="66" width="60" height="3" fill="url(#orange)"/>
  <text x="150" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3.5" fill="#ff6600">XMR402 · AGENTIC PAYMENTS</text>

  <!-- Title -->
  <text x="72" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f5f5f7">The Mirage Metric</text>
  <text x="72" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="31" font-weight="500" fill="#9ca3af">Half the &#8220;volume&#8221; is wash trading.</text>
  <text x="72" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="31" font-weight="500" fill="#ff8c33">XMR402 counts receipts, not movement.</text>

  <!-- Left: wash-trade loop -->
  <g transform="translate(88,330)">
    <rect x="0" y="0" width="470" height="222" rx="14" fill="#12121b" stroke="#ff6600" stroke-opacity="0.18"/>
    <text x="24" y="34" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2.5" fill="#6b7280">THE SELF-FUNDING LOOP</text>

    <!-- nodes -->
    <rect x="30" y="62" width="130" height="52" rx="9" fill="#0a0a0f" stroke="#6b7280" stroke-opacity="0.55"/>
    <text x="95" y="93" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#d1d5db">Operator</text>

    <rect x="300" y="62" width="140" height="52" rx="9" fill="#0a0a0f" stroke="#6b7280" stroke-opacity="0.55"/>
    <text x="370" y="93" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#d1d5db">&#8220;Agent&#8221; wallet</text>

    <!-- arrows both ways -->
    <path d="M168 78 H292" fill="none" stroke="#6b7280" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowDim)"/>
    <text x="230" y="68" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#6b7280">fund</text>

    <path d="M292 100 H168" fill="none" stroke="#6b7280" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowDim)"/>
    <text x="230" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#6b7280">402 pay</text>

    <!-- loop counter -->
    <rect x="30" y="140" width="410" height="54" rx="9" fill="url(#hatch)" fill-opacity="0.25" stroke="#6b7280" stroke-opacity="0.3"/>
    <text x="48" y="164" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#9ca3af">tx_count ++ &#160;&#160; volume ++ &#160;&#160; active_agents ++</text>
    <text x="48" y="184" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#6b7280">services_delivered &#160;&#160;&#8594;&#160;&#160; 0</text>
  </g>

  <!-- Right: raw vs adjusted -->
  <g transform="translate(608,330)">
    <rect x="0" y="0" width="504" height="222" rx="14" fill="#12121b" stroke="#ff6600" stroke-opacity="0.18"/>
    <text x="24" y="34" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2.5" fill="#6b7280">x402 · 30-DAY VOLUME</text>

    <!-- ghost (raw) bar -->
    <rect x="30" y="62" width="330" height="34" rx="6" fill="url(#ghost)" stroke="#6b7280" stroke-opacity="0.4" stroke-dasharray="5 4"/>
    <text x="44" y="85" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#9ca3af">reported</text>
    <text x="374" y="85" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6b7280">headline</text>

    <!-- real bar -->
    <rect x="30" y="112" width="103" height="34" rx="6" fill="url(#realbar)"/>
    <text x="44" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a0a0f">$1.6M</text>
    <text x="148" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#ff8c33">after wash-trade filter</text>

    <line x1="30" y1="164" x2="474" y2="164" stroke="#ff6600" stroke-opacity="0.18" stroke-width="1"/>
    <text x="30" y="190" font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#9ca3af">~$28,000 / day real &#160;·&#160; ~50% self-trading</text>
  </g>

  <!-- footer -->
  <rect x="72" y="586" width="26" height="2" fill="#ff6600"/>
  <text x="112" y="592" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6b7280">xmr402.org &#160;·&#160; @xbtoshi &#160;·&#160; 0-conf TX Proof &#160;·&#160; zero protocol fees</text>
</svg>
